<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DES013BZ2B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DES013BZ2B');
    </script>

    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detailed information about Python Programming skill assessment. Choose from Beginner, Intermediate, or Pro level tests.">
    <meta name="keywords" content="Python test, programming assessment, coding exam, skill certification">
    
    <title>Python Programming Assessment | SkillUprise Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/test-detail.css">
</head>
<body>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb-list" id="breadcrumbList">
                    <li class="breadcrumb-item">
                        <a href="index.html"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="tests.html">All Tests</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a href="tests.html?category=programming">Programming</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Python Programming
                    </li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="test-detail-page">
        <div class="container">
            <div class="test-detail-container">
                <!-- Left Column: Test Info -->
                <div class="test-info-column" id="testInfoColumn">
                    <!-- Test Header will be loaded here -->
                </div>

                <!-- Right Column: Pricing & Action -->
                
                    <!-- Related Tests -->
                    <div class="related-tests" id="relatedTests">
                        <!-- Will be populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>SkillUprise <strong>Pro</strong></span>
                    </div>
                    <p class="footer-description">
                        Professional skill assessment platform providing industry-recognized certifications.
                    </p>
                </div>
                
                <div class="footer-section">
                    <h4>Contact Info</h4>
                    <ul class="contact-info">
                        <li>
                            <i class="fas fa-envelope"></i>
                            <a href="mailto:skiluprise@gmail.com">skiluprise@gmail.com</a>
                        </li>
                        <li>
                            <i class="fas fa-headset"></i>
                            <span>24/7 Support Available</span>
                        </li>
                    </ul>
                </div>
            </div>
            
            <div class="footer-bottom">
                <p>&copy; 2024 SkillUprise Pro. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="js/test-data.js"></script>
    <script>
        // DOM Elements
        const levelOptions = document.querySelectorAll('.level-option');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const startTestBtn = document.getElementById('startTestBtn');
        const addToCartBtn = document.getElementById('addToCartBtn');
        const selectedLevelSpan = document.querySelector('.selected-level');
        const priceSpans = document.querySelectorAll('.price');
        const totalPriceSpan = document.querySelector('.total-price');
        const testNameSummary = document.getElementById('testNameSummary');
        const breadcrumbList = document.getElementById('breadcrumbList');
        const testInfoColumn = document.getElementById('testInfoColumn');
        const relatedTests = document.getElementById('relatedTests');

        // Global state
        let testData = null;
        let selectedLevel = 'beginner';
        let currentPrice = 7;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Get test ID from URL
            const params = new URLSearchParams(window.location.search);
            const testId = params.get('id') || 'python';
            
            // Get test data from centralized source
            testData = TestData.getTestById(testId);
            
            if (!testData) {
                window.location.href = 'tests.html';
                return;
            }
            
            // Parse URL parameters for level
            const levelParam = params.get('level');
            if (levelParam && ['beginner', 'intermediate', 'pro'].includes(levelParam)) {
                selectLevel(levelParam);
            }
            
            // Update page with test data
            updatePageContent();
            
            // Set up event listeners
            setupEventListeners();
            setupFAQ();
            
            // Update button state
            updateButtonState();
            
            // Load related tests
            loadRelatedTests(testId);
        });

        function updatePageContent() {
            // Update breadcrumb
            updateBreadcrumb();
            
            // Update page title
            document.title = `${testData.name} Assessment | SkillUprise Pro`;
            
            // Update meta description
            const metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.content = testData.description;
            }
            
            // Update test info column
            testInfoColumn.innerHTML = generateTestInfoHTML();
            
            // Update pricing card
            updatePricingCard();
            
            // Update payment summary
            testNameSummary.textContent = `${testData.name} Test`;
        }

        function generateTestInfoHTML() {
            const levels = ['beginner', 'intermediate', 'pro'];
            
            return `
                <!-- Test Header -->
                <div class="test-header">
                    <div class="test-category-badge ${testData.category}">
                        <i class="fas ${testData.icon || 'fa-code'}"></i> ${testData.category}
                    </div>
                    <h1 class="test-title">${testData.name} Assessment</h1>
                    <p class="test-subtitle">${testData.description}</p>
                    
                    <div class="test-meta-info">
                        <div class="meta-item">
                            <i class="fas fa-star"></i>
                            <span>${testData.meta.rating}/5 Rating</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-users"></i>
                            <span>${testData.meta.taken.toLocaleString()}+ Professionals Certified</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-calendar-alt"></i>
                            <span>Last Updated: ${testData.meta.lastUpdated}</span>
                        </div>
                    </div>
                </div>

                <!-- Test Description -->
                <div class="test-description-section">
                    <h2><i class="fas fa-info-circle"></i> About This Assessment</h2>
                    <p>The ${testData.name} assessment evaluates your proficiency in one of the world's most popular programming languages. This comprehensive test covers everything from basic syntax to advanced concepts used in real-world applications.</p>
                    
                    <div class="skills-covered">
                        <h3><i class="fas fa-check-circle"></i> Skills You'll Validate:</h3>
                        <div class="skills-grid">
                            ${testData.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                        </div>
                    </div>
                </div>

                <!-- Who Should Take This Test -->
                <div class="target-audience">
                    <h2><i class="fas fa-user-check"></i> Who Should Take This Test?</h2>
                    <div class="audience-grid">
                        <div class="audience-card">
                            <i class="fas fa-graduation-cap"></i>
                            <h4>Students & Freshers</h4>
                            <p>Validate your ${testData.name} knowledge for job applications and internships</p>
                        </div>
                        <div class="audience-card">
                            <i class="fas fa-briefcase"></i>
                            <h4>Working Professionals</h4>
                            <p>Enhance your resume and prove your expertise to employers</p>
                        </div>
                        <div class="audience-card">
                            <i class="fas fa-chart-line"></i>
                            <h4>Career Changers</h4>
                            <p>Demonstrate your ${testData.name} skills when transitioning to tech roles</p>
                        </div>
                        <div class="audience-card">
                            <i class="fas fa-rocket"></i>
                            <h4>Freelancers</h4>
                            <p>Showcase verified skills to attract higher-paying clients</p>
                        </div>
                    </div>
                </div>

                <!-- Test Curriculum -->
                <div class="test-curriculum">
                    <h2><i class="fas fa-book"></i> What You'll Be Tested On</h2>
                    
                    <div class="curriculum-levels">
                        ${levels.map(level => {
                            const levelData = testData.levels[level];
                            const curriculum = TestData.getCurriculum(testData.id, level);
                            
                            const levelIcons = {
                                'beginner': 'fa-seedling',
                                'intermediate': 'fa-chart-line',
                                'pro': 'fa-trophy'
                            };
                            
                            const levelTitles = {
                                'beginner': 'Beginner',
                                'intermediate': 'Intermediate',
                                'pro': 'Pro'
                            };
                            
                            return `
                                <div class="curriculum-level ${level}">
                                    <div class="level-header">
                                        <h3><i class="fas ${levelIcons[level]}"></i> ${levelTitles[level]} Level (₹${levelData.price})</h3>
                                        <span class="level-info">${levelData.questions} Questions • ${levelData.duration} Minutes</span>
                                    </div>
                                    <ul class="curriculum-list">
                                        ${curriculum.map(item => `<li><i class="fas fa-check"></i> ${item}</li>`).join('')}
                                    </ul>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- FAQ Section -->
                <div class="test-faq">
                    <h2><i class="fas fa-question-circle"></i> Frequently Asked Questions</h2>
                    
                    <div class="faq-item">
                        <button class="faq-question">
                            <span>Can I switch between levels during the test?</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="faq-answer">
                            <p>No, you must choose your level before starting the test. Each level (Beginner ₹${testData.levels.beginner.price}, Intermediate ₹${testData.levels.intermediate.price}, Pro ₹${testData.levels.pro.price}) is a separate assessment with its own certificate.</p>
                        </div>
                    </div>
                    
                    <div class="faq-item">
                        <button class="faq-question">
                            <span>How long is the certificate valid?</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="faq-answer">
                            <p>Your certificate does not expire. However, we recommend retaking the test every 1-2 years as technology evolves.</p>
                        </div>
                    </div>
                    
                    <div class="faq-item">
                        <button class="faq-question">
                            <span>What happens if I fail the test?</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="faq-answer">
                            <p>You'll still receive a certificate showing your score. You can retake the test anytime by purchasing it again.</p>
                        </div>
                    </div>
                    
                    <div class="faq-item">
                        <button class="faq-question">
                            <span>Can I get a refund if I'm not satisfied?</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="faq-answer">
                            <p>Refunds are only provided for failed payments. Please review our refund policy before purchasing.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateBreadcrumb() {
            const activeItem = breadcrumbList.querySelector('.breadcrumb-item.active');
            if (activeItem) {
                activeItem.innerHTML = testData.name;
            }
        }

        function updatePricingCard() {
            levelOptions.forEach(option => {
                const level = option.dataset.level;
                const levelData = testData.levels[level];
                
                // Update price
                const priceSpan = option.querySelector('.price');
                if (priceSpan) {
                    priceSpan.textContent = `₹${levelData.price}`;
                }
                
                // Update level details
                const detailsDiv = option.querySelector('.level-details');
                if (detailsDiv) {
                    detailsDiv.innerHTML = `
                        <p><i class="far fa-question-circle"></i> ${levelData.questions} Questions</p>
                        <p><i class="far fa-clock"></i> ${levelData.duration} Minutes</p>
                        <p><i class="fas fa-certificate"></i> ${levelData.certificate}</p>
                        ${level === 'intermediate' ? '<p><i class="fas fa-chart-bar"></i> Detailed Analytics</p>' : ''}
                        ${level === 'pro' ? '<p><i class="fas fa-shield-alt"></i> Verification Portal</p><p><i class="fas fa-badge-check"></i> Digital Badge</p>' : ''}
                    `;
                }
            });
        }

        function loadRelatedTests(currentTestId) {
            const allTests = TestData.tests.filter(test => test.id !== currentTestId);
            
            if (allTests.length === 0) {
                relatedTests.style.display = 'none';
                return;
            }
            
            // Show up to 3 related tests
            const relatedTestsToShow = allTests.slice(0, 3);
            
            relatedTests.innerHTML = `
                <h3><i class="fas fa-th-large"></i> Related Assessments</h3>
                ${relatedTestsToShow.map(test => `
                    <div class="related-test-card">
                        <div class="related-test-header">
                            <span class="test-category ${test.category}">${test.category}</span>
                            <span class="test-level beginner">Beginner</span>
                        </div>
                        <h4>${test.name}</h4>
                        <p>${test.description}</p>
                        <div class="related-test-footer">
                            <span class="price">₹${test.levels.beginner.price}</span>
                            <a href="test-detail.html?id=${test.id}" class="btn btn-outline btn-sm">View</a>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function setupEventListeners() {
            // Level selection
            levelOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const level = this.getAttribute('data-level');
                    selectLevel(level);
                });
            });

            // Start test button
            startTestBtn.addEventListener('click', function() {
                if (validateUserInfo()) {
                    startTest();
                }
            });

            // Add to cart button
            addToCartBtn.addEventListener('click', function() {
                if (validateUserInfo()) {
                    addToCart();
                }
            });

            // Update price when inputs change
            fullNameInput.addEventListener('input', updateButtonState);
            emailInput.addEventListener('input', updateButtonState);
        }

        function selectLevel(level) {
            // Update UI
            levelOptions.forEach(option => {
                option.classList.toggle('active', option.getAttribute('data-level') === level);
            });

            // Update state
            selectedLevel = level;
            currentPrice = testData.levels[level].price;

            // Update UI elements
            updatePriceDisplay();
        }

        function updatePriceDisplay() {
            // Update level indicator
            selectedLevelSpan.textContent = `(${selectedLevel.charAt(0).toUpperCase() + selectedLevel.slice(1)})`;
            
            // Update all price spans
            document.querySelectorAll('.price').forEach(span => {
                span.textContent = `₹${currentPrice}`;
            });
            
            // Update total price
            totalPriceSpan.textContent = `₹${currentPrice}`;
            
            // Update button text
            startTestBtn.innerHTML = `<i class="fas fa-play-circle"></i> Start Assessment - ₹${currentPrice}`;
        }

        function validateUserInfo() {
            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            
            if (!name) {
                alert('Please enter your full name');
                fullNameInput.focus();
                return false;
            }
            
            if (!email) {
                alert('Please enter your email address');
                emailInput.focus();
                return false;
            }
            
            // Simple email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                emailInput.focus();
                return false;
            }
            
            return true;
        }

        function updateButtonState() {
            const isFormValid = fullNameInput.value.trim() && emailInput.value.trim();
            startTestBtn.disabled = !isFormValid;
            addToCartBtn.disabled = !isFormValid;
        }

        function startTest() {
            const userName = fullNameInput.value.trim();
            const userEmail = emailInput.value.trim();
            
            // Show loading state
            startTestBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            startTestBtn.disabled = true;
            
            // Create Razorpay order
            createRazorpayOrder(userName, userEmail);
        }

        function createRazorpayOrder(userName, userEmail) {
            const amount = currentPrice * 100; // Convert to paise
            
            // Generate order ID
            const orderId = 'order_' + Math.random().toString(36).substr(2, 9);
            
            const options = {
                key: 'rzp_live_RUUe8oTGD3QlA3', // Your Razorpay key
                amount: amount,
                currency: 'INR',
                name: 'SkillUprise Pro',
                description: `${testData.name} ${selectedLevel.toUpperCase()} Assessment`,
                order_id: orderId,
                handler: function(response) {
                    // Payment successful
                    handlePaymentSuccess(response, userName, userEmail);
                },
                prefill: {
                    name: userName,
                    email: userEmail
                },
                notes: {
                    test_id: testData.id,
                    test_name: testData.name,
                    level: selectedLevel,
                    questions: testData.levels[selectedLevel].questions,
                    user_name: userName,
                    user_email: userEmail
                },
                theme: {
                    color: '#7c3aed'
                }
            };
            
            const rzp = new Razorpay(options);
            rzp.open();
            
            // Reset button state if payment modal is closed
            rzp.on('payment.failed', function(response) {
                alert('Payment failed. Please try again.');
                startTestBtn.innerHTML = `<i class="fas fa-play-circle"></i> Start Assessment - ₹${currentPrice}`;
                startTestBtn.disabled = false;
            });
        }

        function handlePaymentSuccess(response, userName, userEmail) {
            // Save user data to localStorage
            const testSession = {
                testId: testData.id,
                testName: testData.name,
                level: selectedLevel,
                price: currentPrice,
                userName: userName,
                userEmail: userEmail,
                paymentId: response.razorpay_payment_id,
                orderId: response.razorpay_order_id,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('currentTestSession', JSON.stringify(testSession));
            
            // Redirect to test page
            window.location.href = `begin-test.html?test=${testData.id}&level=${selectedLevel}`;
        }

        function addToCart() {
            const userName = fullNameInput.value.trim();
            const userEmail = emailInput.value.trim();
            
            // Get existing cart or create new
            let cart = JSON.parse(localStorage.getItem('skillupriseCart')) || [];
            
            // Add test to cart
            const cartItem = {
                testId: testData.id,
                testName: testData.name,
                level: selectedLevel,
                price: currentPrice,
                userName: userName,
                userEmail: userEmail,
                addedAt: new Date().toISOString()
            };
            
            cart.push(cartItem);
            localStorage.setItem('skillupriseCart', JSON.stringify(cart));
            
            // Show success message
            alert('Test added to cart! You can purchase multiple tests together from your cart.');
            
            // Update cart count in navbar (if exists)
            updateCartCount();
        }

        function updateCartCount() {
            const cartCountElement = document.querySelector('.cart-count');
            if (cartCountElement) {
                const cart = JSON.parse(localStorage.getItem('skillupriseCart')) || [];
                cartCountElement.textContent = cart.length;
            }
        }

        function setupFAQ() {
            // FAQ functionality will be added after the content is loaded
            setTimeout(() => {
                const faqQuestions = document.querySelectorAll('.faq-question');
                
                faqQuestions.forEach(question => {
                    question.addEventListener('click', function() {
                        const answer = this.nextElementSibling;
                        const icon = this.querySelector('i');
                        
                        // Toggle answer visibility
                        answer.classList.toggle('active');
                        
                        // Toggle icon
                        if (answer.classList.contains('active')) {
                            icon.className = 'fas fa-chevron-up';
                        } else {
                            icon.className = 'fas fa-chevron-down';
                        }
                    });
                });
            }, 100);
        }
    </script>
</body>
</html>
