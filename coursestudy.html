<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study - SkillUpRise</title>
    <script src="course.js"></script>
    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwg8obk8BF_5XMUAlMV3u6kAJmWuRpdMUfY0810p3SokqlwDk2cbmVFZ2YuSRVWvweSIw/exec';
        let currentUser = null;
        let currentCourse = null;
        let currentChapter = 1;
        let userProgress = null;
        let selectedMCQAnswer = null;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #10b981;
            --accent: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #64748b;
            --white: #ffffff;
        }

        body {
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Navigation */
        .navbar {
            background: var(--white);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--secondary), #059669);
            color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar */
        .sidebar {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            height: fit-content;
            position: sticky;
            top: 80px;
        }

        .progress-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0% 0%, var(--light) 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .progress-inner {
            width: 100px;
            height: 100px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .chapters-list {
            margin-top: 1.5rem;
        }

        .chapter-sidebar-item {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chapter-sidebar-item:hover {
            background: var(--light);
        }

        .chapter-sidebar-item.active {
            background: var(--light);
            border-left: 4px solid var(--primary);
        }

        .chapter-sidebar-item.completed .chapter-number {
            background: var(--secondary);
        }

        .chapter-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        /* Main Content */
        .main-content {
            background: var(--white);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            min-height: 600px;
        }

        .chapter-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .chapter-title {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .chapter-meta {
            display: flex;
            gap: 2rem;
            color: var(--gray);
            margin-top: 1rem;
        }

        .chapter-content {
            line-height: 1.8;
            color: var(--dark);
            margin-bottom: 2rem;
        }

        .chapter-content h2, .chapter-content h3, .chapter-content h4 {
            color: var(--dark);
            margin: 1.5rem 0 1rem;
        }

        .chapter-content p {
            margin-bottom: 1rem;
        }

        .chapter-content ul, .chapter-content ol {
            margin-left: 2rem;
            margin-bottom: 1.5rem;
        }

        .chapter-content pre {
            background: var(--dark);
            color: var(--light);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .chapter-content code {
            background: var(--light);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        /* MCQ Section */
        .mcq-section {
            background: var(--light);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            border-left: 4px solid var(--accent);
        }

        .mcq-title {
            color: var(--accent);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .mcq-question {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .mcq-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mcq-option {
            background: var(--white);
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .mcq-option:hover {
            border-color: var(--primary);
            background: var(--light);
        }

        .mcq-option.selected {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        .option-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--light);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .mcq-option.selected .option-letter {
            background: var(--primary);
            color: white;
        }

        /* Practical Task Section */
        .task-section {
            background: var(--light);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
            border-left: 4px solid var(--secondary);
        }

        .task-title {
            color: var(--secondary);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .task-description {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            white-space: pre-line;
            line-height: 1.6;
        }

        .task-requirements {
            background: var(--white);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--primary);
        }

        .task-requirements h4 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            min-height: 150px;
            transition: border 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .task-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-full {
            flex: 1;
        }

        /* Completion Section */
        .completion-section {
            text-align: center;
            padding: 4rem 2rem;
            display: none;
        }

        .completion-icon {
            font-size: 4rem;
            color: var(--secondary);
            margin-bottom: 1rem;
        }

        .completion-title {
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .completion-message {
            color: var(--gray);
            max-width: 600px;
            margin: 0 auto 2rem;
            line-height: 1.8;
        }

        /* Messages */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 3000;
            display: none;
            align-items: center;
            gap: 1rem;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--secondary);
        }

        .message-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        /* Loading */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 4000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="courses.html" class="logo">
            <div class="logo-icon">S</div>
            <div class="logo-text">SkillUp<span>Rise</span></div>
        </a>
        <button class="btn btn-secondary" onclick="window.location.href='coursedetail.html?course=' + getCourseIdFromUrl()">
            <i class="fas fa-arrow-left"></i> Back to Course
        </button>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="progress-circle" id="progressCircle">
                <div class="progress-inner" id="progressPercent">0%</div>
            </div>
            
            <h3 style="text-align: center; margin-bottom: 1.5rem; color: var(--dark);">
                Course Progress
            </h3>
            
            <div class="chapters-list" id="chaptersList">
                <!-- Chapters will be loaded here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Chapter content will be loaded here -->
        </div>
    </div>

    <!-- Message Container -->
    <div class="message" id="message"></div>

    <script>
        // Get course ID from URL
        function getCourseIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('course');
        }

        // Get chapter ID from URL (optional)
        function getChapterIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('chapter') || '1';
        }

        // Initialize
        async function init() {
            showLoading();
            
            // Check if user is logged in
            const storedUser = localStorage.getItem('currentUser');
            if (!storedUser) {
                showMessage('Please login to access course content', 'error');
                setTimeout(() => window.location.href = 'courses.html', 2000);
                return;
            }
            
            currentUser = JSON.parse(storedUser);
            
            // Get course ID
            const courseId = getCourseIdFromUrl();
            if (!courseId) {
                window.location.href = 'courses.html';
                return;
            }
            
            // Get course data
            currentCourse = courseUtils.getCourseById(courseId);
            if (!currentCourse) {
                showMessage('Course not found', 'error');
                setTimeout(() => window.location.href = 'courses.html', 2000);
                return;
            }
            
            // Check course access
            const hasAccess = await checkCourseAccess(courseId);
            if (!hasAccess) {
                showMessage('You need to purchase this course first', 'error');
                setTimeout(() => window.location.href = `coursedetail.html?course=${courseId}`, 2000);
                return;
            }
            
            // Get initial chapter
            currentChapter = parseInt(getChapterIdFromUrl());
            
            // Load user progress
            await loadUserProgress();
            
            // Load chapter content
            loadChapter(currentChapter);
            
            hideLoading();
        }

        // Check course access
        async function checkCourseAccess(courseId) {
            try {
                const response = await callGoogleScript('checkCourseAccess', {
                    userId: currentUser.userId,
                    courseId: courseId
                });
                
                return response.success && response.hasAccess;
            } catch (error) {
                console.error('Access check error:', error);
                return false;
            }
        }

        // Call Google Apps Script
        async function callGoogleScript(functionName, params = {}) {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        functionName: functionName,
                        params: params
                    })
                });
                return await response.json();
            } catch (error) {
                console.error('Google Script call failed:', error);
                return { success: false, message: 'Network error' };
            }
        }

        // Load user progress
        async function loadUserProgress() {
            try {
                const response = await callGoogleScript('getUserProgress', {
                    userId: currentUser.userId,
                    courseId: currentCourse.id
                });
                
                if (response.success) {
                    userProgress = response.data;
                    updateProgressDisplay();
                    updateSidebar();
                }
            } catch (error) {
                console.error('Load progress error:', error);
            }
        }

        // Update progress display
        function updateProgressDisplay() {
            if (!userProgress) return;
            
            const completed = userProgress.chaptersCompleted || 0;
            const total = currentCourse.totalChapters;
            const percentage = total > 0 ? (completed / total) * 100 : 0;
            
            // Update progress circle
            const circle = document.getElementById('progressCircle');
            circle.style.background = `conic-gradient(var(--primary) 0% ${percentage}%, var(--light) ${percentage}% 100%)`;
            document.getElementById('progressPercent').textContent = `${Math.round(percentage)}%`;
        }

        // Update sidebar
        function updateSidebar() {
            const chaptersList = document.getElementById('chaptersList');
            chaptersList.innerHTML = '';
            
            const completedChapters = userProgress ? userProgress.chaptersCompleted || 0 : 0;
            
            currentCourse.chapters.forEach(chapter => {
                const isCompleted = chapter.id <= completedChapters;
                const isActive = chapter.id === currentChapter;
                
                const chapterItem = document.createElement('div');
                chapterItem.className = `chapter-sidebar-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}`;
                chapterItem.innerHTML = `
                    <div class="chapter-number">${chapter.id}</div>
                    <div>
                        <div style="font-weight: 500;">${chapter.title}</div>
                        <div style="font-size: 0.9rem; color: var(--gray);">
                            ${isCompleted ? '✓ Completed' : 'Pending'}
                        </div>
                    </div>
                `;
                chapterItem.onclick = () => {
                    if (isCompleted || chapter.id === currentChapter || chapter.id === currentChapter + 1) {
                        loadChapter(chapter.id);
                    }
                };
                chaptersList.appendChild(chapterItem);
            });
        }

        // Load chapter
        function loadChapter(chapterId) {
            const chapter = courseUtils.getChapter(currentCourse.id, chapterId);
            if (!chapter) {
                // Check if course is completed
                if (chapterId > currentCourse.totalChapters) {
                    showCompletionScreen();
                    return;
                }
                return;
            }
            
            currentChapter = chapterId;
            selectedMCQAnswer = null;
            
            // Check if this chapter is already completed
            const isCompleted = userProgress && userProgress.progress && 
                userProgress.progress.some(p => p.chapterId === chapterId.toString() && p.chapterCompleted);
            
            if (isCompleted && chapterId <= currentCourse.totalChapters) {
                // Load next chapter if current is completed
                loadChapter(parseInt(chapterId) + 1);
                return;
            }
            
            // Update main content
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="chapter-header">
                    <h1 class="chapter-title">Chapter ${chapter.id}: ${chapter.title}</h1>
                    <div class="chapter-meta">
                        <span><i class="far fa-clock"></i> ${chapter.duration}</span>
                    </div>
                </div>
                
                <div class="chapter-content">
                    ${chapter.content}
                </div>
                
                <!-- MCQ Section -->
                <div class="mcq-section">
                    <h3 class="mcq-title">Quick Knowledge Check</h3>
                    <p class="mcq-question">${chapter.mcq.question}</p>
                    <div class="mcq-options" id="mcqOptions">
                        ${chapter.mcq.options.map(option => `
                            <div class="mcq-option" onclick="selectMCQAnswer('${option.id}')">
                                <div class="option-letter">${option.id}</div>
                                <span>${option.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <!-- Practical Task Section -->
                <div class="task-section">
                    <h3 class="task-title">Practical Assignment</h3>
                    <div class="task-description">
                        ${chapter.practicalTask.description}
                    </div>
                    <div class="task-requirements">
                        <h4>Submission Requirements:</h4>
                        <p>${chapter.practicalTask.requirements}</p>
                    </div>
                    
                    <form id="taskForm">
                        <div class="input-group">
                            <label>Your Task Answer/Solution</label>
                            <textarea id="taskAnswer" 
                                      placeholder="Paste your code, describe your solution, or share your implementation details..." 
                                      required></textarea>
                        </div>
                        
                        <div class="input-group">
                            <label>Summary of Your Approach</label>
                            <textarea id="taskSummary" 
                                      placeholder="Briefly explain your thought process, challenges faced, and how you solved them..." 
                                      required></textarea>
                        </div>
                        
                        <div class="task-buttons">
                            <button type="submit" class="btn btn-success btn-full">
                                <i class="fas fa-paper-plane"></i> Submit Chapter
                            </button>
                        </div>
                    </form>
                </div>
            `;
            
            // Update sidebar
            updateSidebar();
            
            // Attach form submit handler
            document.getElementById('taskForm').onsubmit = handleChapterSubmit;
        }

        // Select MCQ answer
        function selectMCQAnswer(answerId) {
            selectedMCQAnswer = answerId;
            
            // Update UI
            const options = document.querySelectorAll('.mcq-option');
            options.forEach(option => {
                option.classList.remove('selected');
                if (option.querySelector('.option-letter').textContent === answerId) {
                    option.classList.add('selected');
                }
            });
        }

        // Handle chapter submission
        async function handleChapterSubmit(event) {
            event.preventDefault();
            
            const chapter = courseUtils.getChapter(currentCourse.id, currentChapter);
            if (!chapter) return;
            
            // Validate MCQ answer
            if (!selectedMCQAnswer) {
                showMessage('Please select an answer for the MCQ', 'error');
                return;
            }
            
            // Get form data
            const taskAnswer = document.getElementById('taskAnswer').value;
            const taskSummary = document.getElementById('taskSummary').value;
            
            if (!taskAnswer || !taskSummary) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            
            showLoading();
            try {
                const response = await callGoogleScript('submitChapterProgress', {
                    userId: currentUser.userId,
                    courseId: currentCourse.id,
                    chapterId: currentChapter,
                    mcqResult: selectedMCQAnswer,
                    taskAnswer: taskAnswer,
                    taskSummary: taskSummary
                });
                
                if (response.success) {
                    showMessage('Chapter submitted successfully!', 'success');
                    
                    // Update local progress
                    if (!userProgress) userProgress = { progress: [], chaptersCompleted: 0 };
                    if (!userProgress.progress) userProgress.progress = [];
                    
                    userProgress.progress.push({
                        chapterId: currentChapter.toString(),
                        chapterCompleted: true
                    });
                    userProgress.chaptersCompleted = (userProgress.chaptersCompleted || 0) + 1;
                    
                    updateProgressDisplay();
                    updateSidebar();
                    
                    // Check if course is completed
                    if (userProgress.chaptersCompleted >= currentCourse.totalChapters) {
                        setTimeout(() => {
                            completeCourse();
                        }, 1500);
                    } else {
                        // Load next chapter after delay
                        setTimeout(() => {
                            loadChapter(parseInt(currentChapter) + 1);
                        }, 2000);
                    }
                } else {
                    showMessage(response.message, 'error');
                }
            } catch (error) {
                console.error('Submit error:', error);
                showMessage('Submission failed. Please try again.', 'error');
            } finally {
                hideLoading();
            }
        }

        // Show completion screen
        function showCompletionScreen() {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="completion-section">
                    <div class="completion-icon">🎉</div>
                    <h2 class="completion-title">Course Completed!</h2>
                    <p class="completion-message">
                        ${currentCourse.completionMessage}
                    </p>
                    <div style="margin-top: 2rem;">
                        <button class="btn btn-primary" onclick="window.location.href='courses.html'">
                            <i class="fas fa-home"></i> Back to Courses
                        </button>
                        <button class="btn btn-secondary" onclick="window.location.href='coursedetail.html?course=${currentCourse.id}'" style="margin-left: 1rem;">
                            <i class="fas fa-star"></i> Leave a Review
                        </button>
                    </div>
                </div>
            `;
            
            // Mark course as completed in backend
            completeCourse();
        }

        // Complete course
        async function completeCourse() {
            try {
                const response = await callGoogleScript('completeCourse', {
                    userId: currentUser.userId,
                    courseId: currentCourse.id
                });
                
                if (!response.success) {
                    console.error('Complete course error:', response.message);
                }
            } catch (error) {
                console.error('Complete course error:', error);
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message message-${type}`;
            messageDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${text}</span>
            `;
            messageDiv.style.display = 'flex';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // Show loading
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }

        // Hide loading
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
