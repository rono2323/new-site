<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    /* Add this to create particles effect */
    .particle {
        position: fixed;
        pointer-events: none;
        z-index: 0;
    }
</style>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Skill Tests | SkillUprise Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tests.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>SkillUprise <strong>Pro</strong></span>
                </a>
                
                <div class="nav-menu" id="navMenu">
                    <ul class="nav-links">
                        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                        <li><a href="tests.html" class="active"><i class="fas fa-list-alt"></i> All Tests</a></li>
                        <li><a href="contact.html"><i class="fas fa-headset"></i> Support</a></li>
                    </ul>
                </div>
                
                <button class="nav-toggle" id="navToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <div class="header-content">
                <h1>Skill Assessment Tests</h1>
                <p>Choose from professional skill tests across three difficulty levels</p>
            </div>
        </div>
    </section>

    <!-- Search & Filters -->
    <section class="filters-section">
        <div class="container">
            <!-- Search Bar -->
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search tests...">
            </div>
            
            <!-- Quick Filters -->
            <div class="quick-filters">
                <button class="filter-btn active" data-filter="all">All Tests</button>
                <button class="filter-btn" data-filter="beginner">Beginner ₹7</button>
                <button class="filter-btn" data-filter="intermediate">Intermediate ₹14</button>
                <button class="filter-btn" data-filter="pro">Pro ₹19</button>
                
                <div class="category-dropdown">
                    <button class="filter-btn">
                        <i class="fas fa-filter"></i> Categories
                    </button>
                    <div class="dropdown-content">
                        <button data-category="all">All Categories</button>
                        <button data-category="programming">Programming</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Tests Grid -->
    <section class="tests-section">
        <div class="container">
            <div class="grid-header">
                <h3 id="results-count">Loading tests...</h3>
                <div class="sort-options">
                    <select id="sort-select">
                        <option value="popular">Most Popular</option>
                        <option value="name">Name A-Z</option>
                        <option value="price">Price Low-High</option>
                        <option value="newest">Newest</option>
                    </select>
                </div>
            </div>
            
            <!-- Tests Grid -->
            <div class="tests-grid" id="tests-grid">
                <!-- Test cards will be loaded here -->
            </div>
            
            <!-- Load More Button -->
            <div class="load-more">
                <button id="load-more-btn" class="btn btn-outline" style="display: none;">
                    <i class="fas fa-sync-alt"></i> Load More Tests
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>SkillUprise <strong>Pro</strong></span>
                    </div>
                    <p>Professional skill assessment platform</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <a href="index.html">Home</a>
                    <a href="tests.html">Tests</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 SkillUprise Pro. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/test-data.js"></script>
    <script>
        // DOM Elements
        const testsGrid = document.getElementById('tests-grid');
        const searchInput = document.getElementById('search-input');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const categoryButtons = document.querySelectorAll('.dropdown-content button');
        const sortSelect = document.getElementById('sort-select');
        const resultsCount = document.getElementById('results-count');
        const loadMoreBtn = document.getElementById('load-more-btn');

        // State
        let allTests = [];
        let filteredTests = [];
        let currentFilter = 'all';
        let currentCategory = 'all';
        let currentSort = 'popular';
        let visibleCount = 12;
        let isLoading = false;

        // Color and icon mappings
        const levelColors = {
            'beginner': '#10b981',
            'intermediate': '#f59e0b',
            'pro': '#8b5cf6'
        };
        
        const levelIcons = {
            'beginner': 'fa-seedling',
            'intermediate': 'fa-chart-line',
            'pro': 'fa-trophy'
        };
        
        const categoryIcons = {
            'programming': 'fa-code',
            'web': 'fa-globe',
            'cloud': 'fa-cloud',
            'data': 'fa-database',
            'security': 'fa-shield-alt',
            'business': 'fa-chart-line'
        };

        // Initialize
        function init() {
            // Get all tests from centralized data
            allTests = TestData.getAllTests();
            
            // Add sequential IDs for filtering
            allTests.forEach((test, index) => {
                test.seqId = index + 1;
            });
            
            filteredTests = [...allTests];
            
            displayTests(filteredTests.slice(0, visibleCount));
            updateResultsCount();
            updateLoadMoreButton();
            setupEventListeners();
            setupMobileMenu();
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Search
            searchInput.addEventListener('input', debounce(handleSearch, 300));
            
            // Level Filters
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const filter = btn.dataset.filter;
                    if (filter) {
                        handleLevelFilter(filter, btn);
                    }
                });
            });
            
            // Category Filters
            categoryButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    handleCategoryFilter(category);
                });
            });
            
            // Sort
            sortSelect.addEventListener('change', () => {
                currentSort = sortSelect.value;
                applyFilters();
            });
            
            // Load More
            loadMoreBtn.addEventListener('click', loadMoreTests);
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.category-dropdown')) {
                    document.querySelector('.dropdown-content').classList.remove('show');
                }
            });
            
            // Category dropdown toggle
            document.querySelector('.category-dropdown .filter-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelector('.dropdown-content').classList.toggle('show');
            });
        }

        // Mobile Menu
        function setupMobileMenu() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (navToggle && navMenu) {
                navToggle.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                    navToggle.innerHTML = navMenu.classList.contains('active') 
                        ? '<i class="fas fa-times"></i>' 
                        : '<i class="fas fa-bars"></i>';
                });
            }
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Handle Search
        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            applyFilters(searchTerm);
        }

        // Handle Level Filter
        function handleLevelFilter(filter, clickedBtn) {
            // Update active button
            filterButtons.forEach(btn => {
                if (btn.dataset.filter) {
                    btn.classList.remove('active');
                }
            });
            clickedBtn.classList.add('active');
            
            currentFilter = filter;
            applyFilters();
        }

        // Handle Category Filter
        function handleCategoryFilter(category) {
            currentCategory = category;
            applyFilters();
            // Close dropdown
            document.querySelector('.dropdown-content').classList.remove('show');
        }

        // Apply all filters
        function applyFilters(searchTerm = '') {
            visibleCount = 12; // Reset visible count
            
            filteredTests = allTests.filter(test => {
                // Level filter
                if (currentFilter !== 'all' && test.level !== currentFilter) {
                    return false;
                }
                
                // Category filter
                if (currentCategory !== 'all' && test.category !== currentCategory) {
                    return false;
                }
                
                // Search filter
                if (searchTerm) {
                    const searchLower = searchTerm.toLowerCase();
                    const testName = test.name.toLowerCase();
                    const testCategory = test.category.toLowerCase();
                    
                    if (!testName.includes(searchLower) && !testCategory.includes(searchLower)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            // Sort tests
            sortTests();
            
            // Display tests
            displayTests(filteredTests.slice(0, visibleCount));
            updateResultsCount();
            updateLoadMoreButton();
        }

        // Sort Tests
        function sortTests() {
            switch(currentSort) {
                case 'name':
                    filteredTests.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'price':
                    filteredTests.sort((a, b) => a.price - b.price);
                    break;
                case 'newest':
                    // Since we don't have dates, sort by sequential ID
                    filteredTests.sort((a, b) => b.seqId - a.seqId);
                    break;
                case 'popular':
                default:
                    filteredTests.sort((a, b) => b.taken - a.taken);
                    break;
            }
        }

        // Display Tests
        function displayTests(tests) {
            if (tests.length === 0) {
                testsGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No tests found</h3>
                        <p>Try adjusting your search or filters</p>
                        <button class="btn btn-primary" onclick="resetFilters()">
                            Reset Filters
                        </button>
                    </div>
                `;
                return;
            }
            
            const testsHTML = tests.map(test => createTestCard(test)).join('');
            testsGrid.innerHTML = testsHTML;
            
            // Add click events to test cards
            document.querySelectorAll('.test-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    // Don't redirect if clicking on buttons
                    if (!e.target.closest('.test-actions')) {
                        const testId = this.dataset.id;
                        window.location.href = `test-detail.html?id=${testId}`;
                    }
                });
            });
        }

        // Create Test Card HTML
        function createTestCard(test) {
            const testDetails = TestData.getTestById(test.id);
            
            // Format taken count
            const takenFormatted = test.taken >= 1000 
                ? (test.taken / 1000).toFixed(1) + 'k' 
                : test.taken.toString();
            
            // Create stars
            const stars = createStars(test.rating);
            
            // Get category icon from test data
            const categoryIcon = testDetails?.icon || categoryIcons[test.category] || 'fa-question-circle';
            
            return `
                <div class="test-card" data-id="${test.id}">
                    <div class="test-header">
                        <span class="test-category">
                            <i class="fas ${categoryIcon}"></i>
                            ${test.category}
                        </span>
                        <span class="test-level" style="background: ${levelColors[test.level]};">
                            <i class="fas ${levelIcons[test.level]}"></i>
                            ${test.level.charAt(0).toUpperCase() + test.level.slice(1)}
                        </span>
                    </div>
                    
                    <div class="test-body">
                        <h3>${test.name}</h3>
                        
                        <div class="test-stats">
                            <span><i class="far fa-question-circle"></i> ${test.questions} Qs</span>
                            <span><i class="far fa-clock"></i> ${test.duration} min</span>
                            <span><i class="fas fa-users"></i> ${takenFormatted}</span>
                        </div>
                        
                        <div class="test-rating">
                            <div class="stars">${stars}</div>
                            <span>${test.rating}/5</span>
                        </div>
                    </div>
                    
                    <div class="test-footer">
                        <div class="test-price">
                            ₹${test.price}
                        </div>
                        <div class="test-actions">
                            <a href="test-detail.html?id=${test.id}" class="btn btn-sm btn-outline">
                                Details
                            </a>
                            <a href="begin-test.html?id=${test.id}&level=${test.level}" class="btn btn-sm btn-primary">
                                Start Test
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper function to create star ratings
        function createStars(rating) {
            return Array(5).fill(0).map((_, i) => {
                if (i < Math.floor(rating)) {
                    return '<i class="fas fa-star"></i>';
                } else if (i < rating) {
                    return '<i class="fas fa-star-half-alt"></i>';
                } else {
                    return '<i class="far fa-star"></i>';
                }
            }).join('');
        }

        // Load More Tests
        function loadMoreTests() {
            if (isLoading) return;
            
            isLoading = true;
            loadMoreBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            
            // Simulate loading delay
            setTimeout(() => {
                visibleCount += 6;
                displayTests(filteredTests.slice(0, visibleCount));
                updateResultsCount();
                updateLoadMoreButton();
                
                isLoading = false;
                loadMoreBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Load More Tests';
                
                // Scroll to show new tests
                if (testsGrid.lastElementChild) {
                    testsGrid.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 500);
        }

        // Update Results Count
        function updateResultsCount() {
            const total = filteredTests.length;
            const showing = Math.min(visibleCount, total);
            resultsCount.textContent = `Showing ${showing} of ${total} tests`;
        }

        // Update Load More Button
        function updateLoadMoreButton() {
            if (visibleCount >= filteredTests.length) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'block';
            }
        }

        // Reset Filters
        function resetFilters() {
            searchInput.value = '';
            currentFilter = 'all';
            currentCategory = 'all';
            currentSort = 'popular';
            visibleCount = 12;
            
            // Reset UI
            filterButtons.forEach(btn => {
                if (btn.dataset.filter === 'all') {
                    btn.classList.add('active');
                } else if (btn.dataset.filter) {
                    btn.classList.remove('active');
                }
            });
            
            sortSelect.value = 'popular';
            applyFilters();
        }

        // Global function for reset button
        window.resetFilters = resetFilters;

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>

    <!-- Particle Background Script -->
    <script>
        // Particle Background
        function createParticles() {
            const container = document.body;
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position and size
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.width = `${Math.random() * 6 + 2}px`;
                particle.style.height = particle.style.width;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                
                // Random color
                const colors = ['rgba(99, 102, 241, 0.5)', 'rgba(139, 92, 246, 0.5)', 'rgba(59, 130, 246, 0.5)'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(particle);
            }
        }
        
        // Initialize particles
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            // Additional dropdown handlers
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.category-dropdown')) {
                    document.querySelectorAll('.dropdown-content').forEach(dropdown => {
                        dropdown.classList.remove('show');
                    });
                }
            });
            
            // Category dropdown toggle
            document.querySelectorAll('.category-dropdown .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dropdown = btn.nextElementSibling;
                    dropdown.classList.toggle('show');
                });
            });
        });
    </script>
</body>
</html>
