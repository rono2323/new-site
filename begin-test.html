<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Test | SkillUprise Pro</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/test-taker.css">
</head>
<body>
    <!-- Test Navigation -->
    <nav class="test-nav">
        <div class="container">
            <div class="nav-content">
                <div class="test-brand">
                    <a href="index.html" class="logo">
                        <i class="fas fa-graduation-cap"></i>
                        <span>SkillUprise <strong>Pro</strong></span>
                    </a>
                    <div class="test-info">
                        <span id="testCategory">Python Programming</span>
                        <span class="level-badge" id="testLevelBadge">Beginner</span>
                    </div>
                </div>
                
                <div class="test-timer">
                    <i class="fas fa-clock"></i>
                    <span id="timer">15:00</span>
                </div>
                
                <button class="nav-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Test Container -->
    <main class="test-container">
        <div class="container">
            <!-- Test Progress -->
            <div class="test-progress">
                <div class="progress-info">
                    <span id="currentQ">1</span> / <span id="totalQ">10</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>

            <!-- Test Content -->
            <div class="test-content">
                <!-- Instructions will be shown here initially -->
                <!-- Question will be loaded here after start -->
                <div id="questionContainer" style="display: none;">
                    <div class="question-header">
                        <h3 id="questionNumber">Question 1</h3>
                        <div class="question-meta">
                            <span class="difficulty">Easy</span>
                            <button class="flag-btn" id="flagBtn">
                                <i class="far fa-flag"></i> Flag
                            </button>
                        </div>
                    </div>
                    
                    <div class="question-text" id="questionText">
                        Loading question...
                    </div>
                    
                    <div class="options-container" id="optionsContainer">
                        <!-- Options will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Test Navigation -->
            <div class="test-navigation">
                <button id="prevBtn" class="btn btn-outline" disabled>
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                
                <div class="test-actions">
                    <button id="clearBtn" class="btn-action" style="display: none;">
                        <i class="fas fa-eraser"></i> Clear
                    </button>
                    <button id="submitBtn" class="btn btn-primary" style="display: none;">
                        Submit Test
                    </button>
                </div>
                
                <button id="nextBtn" class="btn btn-primary" style="display: none;">
                    Next <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Quick Jump Menu -->
    <div class="jump-menu" id="jumpMenu">
        <div class="jump-header">
            <h4><i class="fas fa-list-ol"></i> Questions</h4>
            <button class="close-jump" id="closeJump">&times;</button>
        </div>
        <div class="jump-grid" id="jumpGrid">
            <!-- Question numbers will be added here -->
        </div>
    </div>

    <!-- Submit Modal -->
    <div class="modal" id="submitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-paper-plane"></i> Submit Test</h3>
            </div>
            <div class="modal-body">
                <div class="submit-summary">
                    <p>Are you sure you want to submit the test?</p>
                    <div class="summary-stats">
                        <div class="stat">
                            <i class="far fa-check-circle"></i>
                            <span>Answered: <strong id="answeredCount">0</strong></span>
                        </div>
                        <div class="stat">
                            <i class="far fa-flag"></i>
                            <span>Flagged: <strong id="flaggedCount">0</strong></span>
                        </div>
                        <div class="stat">
                            <i class="far fa-clock"></i>
                            <span>Time: <strong id="timeUsed">0:00</strong></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelSubmit" class="btn btn-outline">Cancel</button>
                <button id="confirmSubmit" class="btn btn-danger">Submit</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/test-data.js"></script>
    <script>
        // Test State
        let testState = {
            testId: null,
            level: null,
            config: null,
            currentQuestion: 1,
            answers: {},
            flagged: new Set(),
            startTime: null,
            timeRemaining: null,
            timer: null,
            testStarted: false
        };

        // DOM Elements
        const questionContainer = document.getElementById('questionContainer');
        const optionsContainer = document.getElementById('optionsContainer');
        const questionText = document.getElementById('questionText');
        const questionNumber = document.getElementById('questionNumber');
        const currentQ = document.getElementById('currentQ');
        const totalQ = document.getElementById('totalQ');
        const progress = document.getElementById('progress');
        const timer = document.getElementById('timer');
        const testLevelBadge = document.getElementById('testLevelBadge');
        const testCategory = document.getElementById('testCategory');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const clearBtn = document.getElementById('clearBtn');
        const flagBtn = document.getElementById('flagBtn');
        const jumpGrid = document.getElementById('jumpGrid');
        const jumpMenu = document.getElementById('jumpMenu');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Get test parameters from URL
            const params = new URLSearchParams(window.location.search);
            testState.testId = params.get('test') || 'python';
            testState.level = params.get('level') || 'beginner';
            
            // Validate parameters
            if (!validateTestParameters()) {
                window.location.href = 'tests.html';
                return;
            }
            
            // Setup test
            setupTest();
            
            // Show instructions
            showInstructions();
            
            // Setup event listeners
            setupEventListeners();
        });

        function validateTestParameters() {
            // Check if test exists
            const testData = TestData.getTestById(testState.testId);
            if (!testData) {
                alert('Test not found. Redirecting to tests page.');
                return false;
            }
            
            // Check if level is valid
            if (!['beginner', 'intermediate', 'pro'].includes(testState.level)) {
                alert('Invalid test level. Redirecting to tests page.');
                return false;
            }
            
            // Check if level has questions
            const questions = TestData.getQuestions(testState.testId, testState.level);
            if (!questions || questions.length === 0) {
                alert('No questions available for this level. Redirecting to tests page.');
                return false;
            }
            
            return true;
        }

        function setupTest() {
            // Get test data from centralized source
            const testData = TestData.getTestById(testState.testId);
            
            if (!testData) {
                window.location.href = 'tests.html';
                return;
            }
            
            // Get level configuration
            testState.config = {
                questions: testData.levels[testState.level].questions,
                time: testData.levels[testState.level].duration * 60, // Convert minutes to seconds
                price: testData.levels[testState.level].price
            };
            
            // Initialize answers object
            for (let i = 1; i <= testState.config.questions; i++) {
                testState.answers[i] = null;
            }
            
            // Set initial time
            testState.timeRemaining = testState.config.time;
            
            // Update UI with test info
            updateTestInfo();
            
            // Build jump grid
            buildJumpGrid();
            
            // Update timer display
            updateTimerDisplay();
        }

        function updateTestInfo() {
            const testData = TestData.getTestById(testState.testId);
            
            // Update test category and name
            testCategory.textContent = testData.name;
            testLevelBadge.textContent = testState.level.charAt(0).toUpperCase() + testState.level.slice(1);
            
            // Update total questions
            totalQ.textContent = testState.config.questions;
            
            // Update page title
            document.title = `${testData.name} - ${testState.level.toUpperCase()} Test | SkillUprise Pro`;
        }

        function showInstructions() {
            const testData = TestData.getTestById(testState.testId);
            const questions = TestData.getQuestions(testState.testId, testState.level);
            
            const instructions = document.createElement('div');
            instructions.className = 'instructions';
            instructions.innerHTML = `
                <div class="instructions-content">
                    <div class="test-header">
                        <div class="test-category-badge ${testData.category}">
                            <i class="fas ${testData.icon || 'fa-code'}"></i> ${testData.category}
                        </div>
                        <h2>${testData.name} - ${testState.level.toUpperCase()} Level</h2>
                    </div>
                    
                    <div class="instructions-body">
                        <div class="instructions-grid">
                            <div class="instruction-item">
                                <i class="fas fa-question-circle"></i>
                                <div>
                                    <h4>Questions</h4>
                                    <p>${testState.config.questions} Multiple Choice Questions</p>
                                </div>
                            </div>
                            <div class="instruction-item">
                                <i class="fas fa-clock"></i>
                                <div>
                                    <h4>Time Limit</h4>
                                    <p>${Math.floor(testState.config.time / 60)} Minutes</p>
                                </div>
                            </div>
                            
                            
                        
                        
                        
                        
                        
                        <div class="instructions-actions">
                            <button class="btn btn-primary btn-lg" id="startTestBtn">
                                <i class="fas fa-play-circle"></i> Start Test Now
                            </button>
                            <button class="btn btn-outline" id="viewQuestionsBtn">
                                <i class="fas fa-eye"></i> Preview Questions
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.querySelector('.test-content').appendChild(instructions);
            
            // Add event listeners to instruction buttons
            document.getElementById('startTestBtn').addEventListener('click', startTest);
            document.getElementById('viewQuestionsBtn').addEventListener('click', previewQuestions);
        }

        function previewQuestions() {
            const questions = TestData.getQuestions(testState.testId, testState.level);
            
            if (!questions || questions.length === 0) {
                alert('No questions available for preview.');
                return;
            }
            
            // Show first question as preview
            const question = questions[0];
            
            const preview = document.createElement('div');
            preview.className = 'question-preview';
            preview.innerHTML = `
                <div class="preview-header">
                    <h3><i class="fas fa-eye"></i> Question Preview</h3>
                    <button class="btn btn-sm btn-outline" id="closePreview">Close</button>
                </div>
                <div class="preview-body">
                    <div class="question-text">${question.question}</div>
                    <div class="options-preview">
                        ${question.options.map((option, index) => `
                            <div class="option-preview">
                                <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                                <span class="option-text">${option}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            // Remove existing preview if any
            const existingPreview = document.querySelector('.question-preview');
            if (existingPreview) {
                existingPreview.remove();
            }
            
            document.querySelector('.test-content').appendChild(preview);
            
            // Add close event
            document.getElementById('closePreview').addEventListener('click', () => {
                preview.remove();
            });
        }

        function startTest() {
            if (testState.testStarted) return;
            
            testState.testStarted = true;
            testState.startTime = Date.now();
            
            // Remove instructions
            const instructions = document.querySelector('.instructions');
            if (instructions) {
                instructions.remove();
            }
            
            // Remove preview if exists
            const preview = document.querySelector('.question-preview');
            if (preview) {
                preview.remove();
            }
            
            // Show test interface
            questionContainer.style.display = 'block';
            prevBtn.style.display = 'inline-flex';
            nextBtn.style.display = 'inline-flex';
            clearBtn.style.display = 'inline-flex';
            submitBtn.style.display = 'block';
            
            // Load first question
            loadQuestion(1);
            
            // Start timer
            startTimer();
        }

        function loadQuestion(number) {
            if (number < 1 || number > testState.config.questions) return;
            
            testState.currentQuestion = number;
            
            // Get question data from centralized source
            const questionData = getQuestionData(number);
            if (!questionData) {
                // If no question data, show error and load next
                if (number < testState.config.questions) {
                    loadQuestion(number + 1);
                }
                return;
            }
            
            // Update UI
            updateUI();
            renderQuestion(questionData);
        }

        function getQuestionData(number) {
            const questions = TestData.getQuestions(testState.testId, testState.level);
            return questions ? questions[number - 1] : null;
        }

        function updateUI() {
            // Update counters
            currentQ.textContent = testState.currentQuestion;
            
            // Update progress bar
            const percent = ((testState.currentQuestion - 1) / testState.config.questions) * 100;
            progress.style.width = percent + '%';
            
            // Update navigation buttons
            prevBtn.disabled = testState.currentQuestion === 1;
            
            // Show submit button on last question
            if (testState.currentQuestion === testState.config.questions) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'inline-flex';
                submitBtn.style.display = 'none';
            }
            
            // Update flag button
            updateFlagButton();
            
            // Update jump grid
            updateJumpGrid();
        }

        function renderQuestion(questionData) {
            // Update question number
            questionNumber.textContent = `Question ${questionData.id}`;
            
            // Update question text
            questionText.textContent = questionData.question;
            
            // Render options
            renderOptions(questionData);
        }

        function renderOptions(questionData) {
            optionsContainer.innerHTML = '';
            
            questionData.options.forEach((option, index) => {
                const isSelected = testState.answers[questionData.id] === index;
                const optionLetter = String.fromCharCode(65 + index); // A, B, C, D
                
                const optionElement = document.createElement('div');
                optionElement.className = `option ${isSelected ? 'selected' : ''}`;
                optionElement.innerHTML = `
                    <div class="option-selector">
                        <div class="selector">${optionLetter}</div>
                    </div>
                    <div class="option-text">${option}</div>
                `;
                
                optionElement.addEventListener('click', () => {
                    selectOption(questionData.id, index);
                });
                
                optionsContainer.appendChild(optionElement);
            });
        }

        function selectOption(questionId, optionIndex) {
            testState.answers[questionId] = optionIndex;
            
            // Update UI to show selected option
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            const selectedOption = document.querySelectorAll('.option')[optionIndex];
            if (selectedOption) {
                selectedOption.classList.add('selected');
            }
            
            // Update jump grid
            updateJumpGrid();
            
            // Auto-advance to next question after delay (optional)
            if (testState.testStarted && testState.currentQuestion < testState.config.questions) {
                setTimeout(() => {
                    loadQuestion(testState.currentQuestion + 1);
                }, 500);
            }
        }

        function updateFlagButton() {
            const isFlagged = testState.flagged.has(testState.currentQuestion);
            const icon = flagBtn.querySelector('i');
            
            if (isFlagged) {
                icon.className = 'fas fa-flag';
                flagBtn.classList.add('flagged');
            } else {
                icon.className = 'far fa-flag';
                flagBtn.classList.remove('flagged');
            }
        }

        function buildJumpGrid() {
            jumpGrid.innerHTML = '';
            
            for (let i = 1; i <= testState.config.questions; i++) {
                const btn = document.createElement('button');
                btn.className = 'jump-btn';
                btn.textContent = i;
                btn.setAttribute('data-q', i);
                
                btn.addEventListener('click', () => {
                    loadQuestion(i);
                    jumpMenu.classList.remove('show');
                });
                
                jumpGrid.appendChild(btn);
            }
        }

        function updateJumpGrid() {
            document.querySelectorAll('.jump-btn').forEach(btn => {
                const qNum = parseInt(btn.getAttribute('data-q'));
                const isCurrent = qNum === testState.currentQuestion;
                const isAnswered = testState.answers[qNum] !== null;
                const isFlagged = testState.flagged.has(qNum);
                
                btn.className = 'jump-btn';
                if (isCurrent) btn.classList.add('current');
                if (isAnswered) btn.classList.add('answered');
                if (isFlagged) btn.classList.add('flagged');
            });
        }

        function startTimer() {
            updateTimerDisplay();
            
            testState.timer = setInterval(() => {
                testState.timeRemaining--;
                updateTimerDisplay();
                
                if (testState.timeRemaining <= 0) {
                    clearInterval(testState.timer);
                    submitTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(testState.timeRemaining / 60);
            const secs = testState.timeRemaining % 60;
            timer.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // Warning for last 5 minutes
            if (testState.timeRemaining <= 300) {
                timer.style.color = '#ef4444';
                timer.classList.add('warning');
            }
            
            // Critical for last minute
            if (testState.timeRemaining <= 60) {
                timer.style.color = '#dc2626';
                timer.classList.add('critical');
            }
        }

        function setupEventListeners() {
            // Navigation buttons
            prevBtn.addEventListener('click', () => {
                loadQuestion(testState.currentQuestion - 1);
            });
            
            nextBtn.addEventListener('click', () => {
                loadQuestion(testState.currentQuestion + 1);
            });
            
            // Flag button
            flagBtn.addEventListener('click', () => {
                const qId = testState.currentQuestion;
                if (testState.flagged.has(qId)) {
                    testState.flagged.delete(qId);
                } else {
                    testState.flagged.add(qId);
                }
                updateFlagButton();
                updateJumpGrid();
            });
            
            // Clear button
            clearBtn.addEventListener('click', () => {
                testState.answers[testState.currentQuestion] = null;
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                updateJumpGrid();
            });
            
            // Submit button
            submitBtn.addEventListener('click', showSubmitModal);
            
            // Jump menu
            document.getElementById('menuToggle').addEventListener('click', () => {
                jumpMenu.classList.toggle('show');
            });
            
            document.getElementById('closeJump').addEventListener('click', () => {
                jumpMenu.classList.remove('show');
            });
            
            // Modal buttons
            document.getElementById('cancelSubmit').addEventListener('click', hideSubmitModal);
            document.getElementById('confirmSubmit').addEventListener('click', submitTest);
            
            // Prevent leaving during test
            window.addEventListener('beforeunload', (e) => {
                if (testState.testStarted) {
                    e.preventDefault();
                    e.returnValue = 'Are you sure you want to leave? Your test progress will be lost.';
                }
            });
        }

        function showSubmitModal() {
            // Calculate stats
            const answered = Object.values(testState.answers).filter(a => a !== null).length;
            const flagged = testState.flagged.size;
            const timeUsed = testState.config.time - testState.timeRemaining;
            const mins = Math.floor(timeUsed / 60);
            const secs = timeUsed % 60;
            
            // Update modal
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('flaggedCount').textContent = flagged;
            document.getElementById('timeUsed').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            // Show modal
            document.getElementById('submitModal').classList.add('show');
        }

        function hideSubmitModal() {
            document.getElementById('submitModal').classList.remove('show');
        }

        function submitTest() {
            // Stop timer
            if (testState.timer) {
                clearInterval(testState.timer);
            }
            
            // Calculate score
            const score = calculateScore();
            
            // Save result
            saveResult(score);
            
            // Redirect to results/payment page
            redirectToResults(score);
        }

        function calculateScore() {
            let correct = 0;
            const totalQuestions = testState.config.questions;
            
            for (let i = 1; i <= totalQuestions; i++) {
                const userAnswer = testState.answers[i];
                const questionData = getQuestionData(i);
                
                if (questionData && userAnswer === questionData.correct) {
                    correct++;
                }
            }
            
            const percentage = totalQuestions > 0 ? Math.round((correct / totalQuestions) * 100) : 0;
            
            return {
                correct,
                total: totalQuestions,
                percentage,
                level: testState.level,
                testId: testState.testId,
                timeUsed: testState.config.time - testState.timeRemaining
            };
        }

        function saveResult(score) {
            const testData = TestData.getTestById(testState.testId);
            
            const result = {
                testId: testState.testId,
                testName: testData.name,
                level: testState.level,
                score: score.percentage,
                correct: score.correct,
                total: score.total,
                timeUsed: score.timeUsed,
                timestamp: new Date().toISOString(),
                answers: testState.answers,
                flagged: Array.from(testState.flagged),
                price: testState.config.price
            };
            
            // Save to localStorage
            localStorage.setItem('lastTestResult', JSON.stringify(result));
            
            // Add to test history
            let history = JSON.parse(localStorage.getItem('testHistory') || '[]');
            history.push(result);
            localStorage.setItem('testHistory', JSON.stringify(history.slice(-20))); // Keep last 20 tests
        }

        function redirectToResults(score) {
            // Create query parameters
            const params = new URLSearchParams({
                test: testState.testId,
                level: testState.level,
                score: score.percentage,
                correct: score.correct,
                total: score.total,
                time: score.timeUsed,
                price: testState.config.price
            });
            
            // Redirect to results page
            window.location.href = `payment.html?${params.toString()}`;
        }
    </script>
</body>
</html>
